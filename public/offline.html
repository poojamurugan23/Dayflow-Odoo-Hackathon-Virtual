<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline · Dayflow</title>
    <style>
      :root { --plum:#502D55; --mauve:#935073; --cream:#F6DBC0; --paper:#F8F4E9; }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100svh; display: grid; place-items: center; padding: 1.5rem;
        background-image: linear-gradient(135deg, var(--plum) 0%, var(--mauve) 42%, var(--cream) 100%);
        font-family: "Schibsted Grotesk", ui-sans-serif, system-ui, -apple-system, sans-serif;
        color: var(--paper);
      }
      .card {
        max-width: 22rem; text-align: center; background: var(--paper); color: #241826;
        border-radius: 1rem; padding: 2rem 1.5rem;
        box-shadow: 0 20px 50px -20px rgba(36,24,38,.55);
      }
      h1 { margin: 0 0 .5rem; font-size: 1.125rem; }
      p { margin: 0; font-size: .875rem; color: #6F6070; line-height: 1.5; }
      .mark {
        width: 2.75rem; height: 2.75rem; margin: 0 auto 1rem; border-radius: .625rem;
        background-image: linear-gradient(135deg, var(--plum), var(--mauve));
        color: var(--paper); font-weight: 700; font-size: 1.25rem;
        display: grid; place-items: center;
      }
      button {
        margin-top: 1.25rem; border: 0; cursor: pointer;
        background: var(--plum); color: var(--paper);
        border-radius: .5rem; padding: .5rem 1rem; font: inherit; font-size: .875rem;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="mark">D</div>
      <h1>You're offline</h1>
      <p>
        Dayflow needs a connection — attendance, leave and payroll are read live so
        two people never see different numbers.
      </p>
      <button onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
